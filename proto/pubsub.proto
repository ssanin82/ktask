syntax = "proto3";

package pubsub;

service Publisher {
  // Client subscribes to a topic and receives a stream of messages
  rpc Subscribe (SubscribeRequest) returns (stream Message);
}

message SubscribeRequest {
  string topic = 1;
}

message Level {
  string price = 1;
  string size = 2;
}

message Message {
  string topic = 1;
  string spread = 2;
  repeated Level bids = 3;
  repeated Level asks = 4;
}
